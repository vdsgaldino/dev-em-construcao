<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carros e Bicicletas</title>
</head>
<body>
    <style>
        body {
            font-family: Arial;
        }

        .card {
            background-color: #111;
            color: #b2b2b2;
            margin: 30px;
            padding: 20px;
            border-radius: 4px;
        }
        a {
            display: inline-block;
            color: #332200;
            background-color: #febe01;
            text-decoration: none;
            padding: 10px;
            border-radius: 4px;
            width: fit-content;
        }

        .card h2 {
            color: white;
        }

        span {
            color: #febe01;
        }

        h1 {
            text-align: center;
        }

        h2 {
            margin: 0px;
        }

    </style>
    <a href="../../lesson-0214.html">Voltar para a aula</a>
    <p>(O botãozinho ficou legal aqui hein?)</p>
    <hr>
    <h1>
            Carros e Bicicletas
    </h1>
    <div class="card">
        <h2>
            Carro: <span>R$ 1999</span>
        </h2>
        <p>
            Carro modelo <span>2045</span>, com <span>200km</span> rodados.
        </p>
        <a href="#">Comprar Carro</a>
    </div>
    <div class="card">
        <h2>
            Bicicleta: <span>R$ 199</span>
        </h2>
        <p>
            Bicicleta modelo 2050, com 20km rodados.
        </p>
        <a href="#">Comprar Bicicleta</a>
    </div>
</body>
</html>
